<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVP Arena - Melee</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;font-family:Inter,system-ui,Arial;color:#fff}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.card{position:absolute;top:12px;width:280px;padding:11px 14px;background:rgba(4,9,16,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:14px}
#p1{left:12px}#p2{right:12px;text-align:right}
.name{font-weight:900;font-size:17px}.bar{height:11px;background:#18212d;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;width:100%;transition:width .12s}.blue{background:#32a8ff}.red{background:#ff4d67}
.small{font-size:12px;color:#cbd5e1;line-height:1.6}
#score{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-size:27px;font-weight:1000;text-shadow:0 3px 18px #000}
#cross1,#cross2{position:absolute;top:50%;font-size:30px;font-weight:900;text-shadow:0 2px 8px #000;transform:translateY(-50%);display:none}
#cross1{left:25%}#cross2{left:75%}
#split{position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.45);box-shadow:0 0 12px rgba(255,255,255,.35)}
#help{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:11px;background:rgba(4,9,16,.78);font-size:12px;color:#d5deea;text-align:center}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;font-weight:1000;text-align:center;text-shadow:0 5px 30px #000;display:none}
button{pointer-events:auto;border:0;border-radius:11px;padding:10px 17px;font-weight:800;cursor:pointer}
#restart{margin-top:14px}
.weapon{font-weight:900}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="p1" class="card"><div class="name">🔵 OYUNCU 1</div><div class="bar"><div id="hp1" class="fill blue"></div></div><div class="small" id="info1"></div></div>
 <div id="p2" class="card"><div class="name">🔴 OYUNCU 2</div><div class="bar"><div id="hp2" class="fill red"></div></div><div class="small" id="info2"></div></div>
 <div id="score">0 - 0</div>
 <div id="cross1">+</div><div id="cross2">+</div><div id="split"></div>
 <div id="help">P1: WASD · F saldır · G atıl · 1 Kılıç · 2 Balta · 3 Hançer &nbsp; | &nbsp; P2: Oklar · L saldır · K atıl · 8 Kılıç · 9 Balta · 0 Hançer</div>
 <div id="message"></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x081321);
scene.fog=new THREE.Fog(0x081321,22,90);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.autoClear=false;
document.querySelector('#game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc9e7ff,0x121a27,2.2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(10,32,12);sun.castShadow=true;scene.add(sun);

function box(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.68}));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
box(0,-1,0,70,2,52,0x182333);
for(const [x,z,w,d] of [[0,-25,70,2],[0,25,70,2],[-35,0,2,52],[35,0,2,52]])box(x,3,z,w,8,d,0x26374a);
for(const p of [[0,0,0,12,2,5],[-20,1,-7,8,2,7],[20,1,7,8,2,7],[0,2,15,7,2,5],[0,2,-15,7,2,5]])box(...p,0x31465d);

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;handleWeaponKeys(e.code)});
addEventListener('keyup',e=>keys[e.code]=false);

const weaponData={
 sword:{name:'KILIÇ',damage:24,range:3.1,arc:1.15,cool:.48,color:0xdfe8f2,type:'sword'},
 axe:{name:'BALTA',damage:42,range:2.75,arc:.82,cool:1.05,color:0xb8c1ca,type:'axe'},
 dagger:{name:'HANÇER',damage:15,range:2.35,arc:.55,cool:.22,color:0x9ee8ff,type:'dagger'}
};

const players=[
 {id:1,pos:new THREE.Vector3(-22,1.2,0),color:0x32a8ff,hp:100,score:0,dashes:2,dashCd:0,attackCd:0,hitCd:0,keys:['KeyW','KeyS','KeyA','KeyD'],attack:'KeyF',dash:'KeyG',rot:Math.PI/2,weapon:'sword',held:false},
 {id:2,pos:new THREE.Vector3(22,1.2,0),color:0xff4d67,hp:100,score:0,dashes:2,dashCd:0,attackCd:0,hitCd:0,keys:['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],attack:'KeyL',dash:'KeyK',rot:-Math.PI/2,weapon:'sword',held:false}
];

function makeBody(p){
 const g=new THREE.Group();g.position.copy(p.pos);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(1.05,1.3,6,12),new THREE.MeshStandardMaterial({color:p.color,roughness:.42}));
 body.castShadow=true;g.add(body);
 const visor=new THREE.Mesh(new THREE.BoxGeometry(.95,.35,.22),new THREE.MeshStandardMaterial({color:0x07101b,metalness:.7,roughness:.2}));
 visor.position.set(0,.45,-.9);g.add(visor);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35,.06,8,24),new THREE.MeshBasicMaterial({color:p.color,transparent:true,opacity:.7}));
 ring.rotation.x=Math.PI/2;ring.position.y=-1.05;g.add(ring);
 scene.add(g);p.mesh=g;p.body=body;
}

function weaponMesh(data){
 const g=new THREE.Group();
 if(data.type==='sword'){
   const blade=new THREE.Mesh(new THREE.BoxGeometry(.16,1.9,.08),new THREE.MeshStandardMaterial({color:data.color,metalness:.75,roughness:.2}));
   blade.position.y=.95;g.add(blade);
   const guard=new THREE.Mesh(new THREE.BoxGeometry(.8,.1,.13),new THREE.MeshStandardMaterial({color:0x8b6b35,metalness:.6}));
   guard.position.y=-.05;g.add(guard);
   const grip=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.65,10),new THREE.MeshStandardMaterial({color:0x4a2d20}));
   grip.position.y=-.4;g.add(grip);
 }else if(data.type==='axe'){
   const handle=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,1.9,10),new THREE.MeshStandardMaterial({color:0x633d25}));
   handle.rotation.z=.15;handle.position.y=.75;g.add(handle);
   const head=new THREE.Mesh(new THREE.BoxGeometry(.85,.7,.16),new THREE.MeshStandardMaterial({color:data.color,metalness:.7,roughness:.25}));
   head.position.set(.25,1.5,0);head.rotation.z=-.28;g.add(head);
 }else{
   const blade=new THREE.Mesh(new THREE.ConeGeometry(.16,.95,4),new THREE.MeshStandardMaterial({color:data.color,metalness:.8,roughness:.18}));
   blade.rotation.z=-Math.PI/2;blade.position.x=.55;g.add(blade);
   const grip=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.55,10),new THREE.MeshStandardMaterial({color:0x3b251c}));
   grip.rotation.z=Math.PI/2;grip.position.x=-.08;g.add(grip);
 }
 return g;
}

players.forEach(p=>{makeBody(p);p.weaponView=weaponMesh(weaponData[p.weapon]);});

const cameras=[
 new THREE.PerspectiveCamera(78,1,.08,120),
 new THREE.PerspectiveCamera(78,1,.08,120)
];

function handleWeaponKeys(code){
 if(code==='Digit1')players[0].weapon='sword';
 if(code==='Digit2')players[0].weapon='axe';
 if(code==='Digit3')players[0].weapon='dagger';
 if(code==='Digit8')players[1].weapon='sword';
 if(code==='Digit9')players[1].weapon='axe';
 if(code==='Digit0')players[1].weapon='dagger';
 updateWeaponViews();
}

function updateWeaponViews(){
 players.forEach((p,i)=>{
   if(p.weaponView)scene.remove(p.weaponView);
   p.weaponView=weaponMesh(weaponData[p.weapon]);
   p.weaponView.traverse(o=>{if(o.isMesh)o.castShadow=true});
   cameras[i].add(p.weaponView);
   p.weaponView.position.set(.72,-.65,-1.05);
   p.weaponView.rotation.set(-.25,0,-.22);
 });
}
players.forEach((p,i)=>{cameras[i].add(new THREE.AmbientLight(p.color,.18));scene.add(cameras[i]);});
updateWeaponViews();

function attack(p){
 const data=weaponData[p.weapon];
 if(p.attackCd>0||p.hp<=0)return;
 p.attackCd=data.cool;
 p.attackAnim=.22;
 const target=players[p.id===1?1:0];
 const toTarget=new THREE.Vector3(target.pos.x-p.pos.x,0,target.pos.z-p.pos.z);
 const dist=toTarget.length();
 if(dist>data.range)return;
 toTarget.normalize();
 const facing=new THREE.Vector3(Math.sin(p.rot),0,Math.cos(p.rot));
 const angle=Math.acos(THREE.MathUtils.clamp(facing.dot(toTarget),-1,1));
 if(angle<=data.arc)damage(target,data.damage);
}

function damage(p,n){
 if(p.hitCd>0||p.hp<=0)return;
 p.hp=Math.max(0,p.hp-n);p.hitCd=.12;
 p.body.scale.set(1.15,.85,1.15);
 setTimeout(()=>p.body?.scale.set(1,1,1),90);
 if(p.hp===0){
   const winner=players[p.id===1?1:0];
   winner.score++;updateScore();endRound(winner);
 }
}

function dash(p){
 if(p.dashes<=0||p.dashCd>0||p.hp<=0)return;
 p.dashes--;p.dashCd=.55;
 const d=new THREE.Vector3(Math.sin(p.rot),0,Math.cos(p.rot));
 p.pos.addScaledVector(d,6);
 p.pos.x=THREE.MathUtils.clamp(p.pos.x,-31,31);
 p.pos.z=THREE.MathUtils.clamp(p.pos.z,-21,21);
}

function endRound(winner){
 running=false;
 message.style.display='block';
 message.innerHTML=(winner.id===1?'🔵 OYUNCU 1':'🔴 OYUNCU 2')+' KAZANDI!<br><button id="restart">YENİ RAUNT</button>';
 document.querySelector('#restart').onclick=resetRound;
}

function resetRound(){
 players[0].pos.set(-22,1.2,0);players[0].rot=Math.PI/2;
 players[1].pos.set(22,1.2,0);players[1].rot=-Math.PI/2;
 players.forEach(p=>{p.hp=100;p.dashes=2;p.dashCd=0;p.attackCd=0;p.hitCd=0;p.attackAnim=0});
 message.style.display='none';running=true;
}

function updateScore(){score.textContent=players[0].score+' - '+players[1].score}

function move(p,dt){
 const [up,down,left,right]=p.keys;
 const v=new THREE.Vector3((keys[right]?1:0)-(keys[left]?1:0),0,(keys[down]?1:0)-(keys[up]?1:0));
 if(v.lengthSq()){
   v.normalize();
   p.pos.addScaledVector(v,10.5*dt);
   p.rot=Math.atan2(v.x,v.z);
 }
 p.pos.x=THREE.MathUtils.clamp(p.pos.x,-31,31);
 p.pos.z=THREE.MathUtils.clamp(p.pos.z,-21,21);
 p.mesh.position.copy(p.pos);
 p.mesh.rotation.y=p.rot;
 if(keys[p.attack]&&!p.held){attack(p);p.held=true}else if(!keys[p.attack])p.held=false;
 if(keys[p.dash]&&!p.dashHeld){dash(p);p.dashHeld=true}else if(!keys[p.dash])p.dashHeld=false;
 p.attackCd=Math.max(0,p.attackCd-dt);
 p.dashCd=Math.max(0,p.dashCd-dt);
 p.hitCd=Math.max(0,p.hitCd-dt);
 if(p.dashes<2&&p.dashCd===0)p.dashes=2;
 if(p.attackAnim>0){
   p.attackAnim-=dt;
   const w=p.weaponView;
   w.rotation.z=-.22-(.9*(p.attackAnim/.22));
   if(p.attackAnim<=0)w.rotation.z=-.22;
 }
}

function updateCameras(){
 players.forEach((p,i)=>{
   const cam=cameras[i];
   const forward=new THREE.Vector3(Math.sin(p.rot),0,Math.cos(p.rot));
   cam.position.set(p.pos.x,p.pos.y+1.05,p.pos.z);
   cam.lookAt(p.pos.x+forward.x*10,p.pos.y+1.0,p.pos.z+forward.z*10);
 });
}

function hud(){
 hp1.style.width=players[0].hp+'%';hp2.style.width=players[1].hp+'%';
 const w1=weaponData[players[0].weapon],w2=weaponData[players[1].weapon];
 info1.innerHTML='<span class="weapon">'+w1.name+'</span> · Hasar '+w1.damage+' · '+(players[0].attackCd>0?'Bekle '+players[0].attackCd.toFixed(1)+' sn':'Hazır')+'<br>Atılma: '+players[0].dashes+'/2';
 info2.innerHTML='<span class="weapon">'+w2.name+'</span> · Hasar '+w2.damage+' · '+(players[1].attackCd>0?'Bekle '+players[1].attackCd.toFixed(1)+' sn':'Hazır')+'<br>Atılma: '+players[1].dashes+'/2';
 cross1.style.display='block';cross2.style.display='block';
}

const hp1=document.querySelector('#hp1'),hp2=document.querySelector('#hp2'),info1=document.querySelector('#info1'),info2=document.querySelector('#info2'),score=document.querySelector('#score'),message=document.querySelector('#message'),cross1=document.querySelector('#cross1'),cross2=document.querySelector('#cross2');
let running=true,last=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.033);last=now;
 if(running){players.forEach(p=>move(p,dt));updateCameras();hud();}
 renderer.setScissorTest(true);
 renderer.setViewport(0,0,innerWidth/2,innerHeight);
 renderer.setScissor(0,0,innerWidth/2,innerHeight);
 renderer.render(scene,cameras[0]);
 renderer.setViewport(innerWidth/2,0,innerWidth/2,innerHeight);
 renderer.setScissor(innerWidth/2,0,innerWidth/2,innerHeight);
 renderer.render(scene,cameras[1]);
 renderer.setScissorTest(false);
}
updateScore();updateCameras();animate(performance.now());

addEventListener('resize',()=>{
 renderer.setSize(innerWidth,innerHeight);
 cameras.forEach(c=>{c.aspect=(innerWidth/2)/innerHeight;c.updateProjectionMatrix()});
});
cameras.forEach(c=>{c.aspect=(innerWidth/2)/innerHeight;c.updateProjectionMatrix()});
</script>
</body>
</html>
