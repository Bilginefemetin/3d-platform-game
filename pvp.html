<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melee Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;font-family:Inter,system-ui,Arial;color:#fff}#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}.card{position:absolute;top:14px;width:290px;padding:12px 15px;background:rgba(4,9,16,.76);backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.14);border-radius:14px}.card.left{left:14px}.name{font-weight:900;font-size:18px}.bar{height:12px;background:#18212d;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;width:100%;transition:width .12s}.blue{background:#32a8ff}.red{background:#ff4d67}.small{font-size:12px;color:#d2dbe7;line-height:1.65}
#score{position:absolute;top:15px;right:16px;font-size:18px;font-weight:900;text-shadow:0 3px 15px #000}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px;font-weight:900;text-shadow:0 2px 8px #000}
#weapon{position:absolute;right:18px;bottom:68px;padding:10px 14px;border-radius:12px;background:rgba(4,9,16,.7);font-weight:900;text-align:right}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:11px;background:rgba(4,9,16,.8);font-size:12px;color:#d5deea;text-align:center}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:1000;text-align:center;text-shadow:0 5px 30px #000;display:none}
button{pointer-events:auto;border:0;border-radius:11px;padding:10px 17px;font-weight:800;cursor:pointer}
#damageFlash{position:fixed;inset:0;background:rgba(255,40,50,.18);opacity:0;pointer-events:none}
</style></head>
<body>
<div id="game"></div><div id="damageFlash"></div>
<div id="hud">
 <div class="card left"><div class="name">⚔️ OYUNCU</div><div class="bar"><div id="hp" class="fill blue"></div></div><div class="small" id="info"></div></div>
 <div id="score">Rakip: 0</div><div id="cross">+</div><div id="weapon"></div>
 <div id="help">WASD hareket · Mouse bakış · Sol tık saldır · Shift koş · Space atılma · 1 Kılıç · 2 Balta · 3 Hançer</div>
 <div id="message"></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x081321);scene.fog=new THREE.Fog(0x081321,18,85);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9e7ff,0x121a27,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(10,32,12);sun.castShadow=true;scene.add(sun);
function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.68}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m)}
box(0,-1,0,70,2,52,0x182333);for(const [x,z,w,d] of [[0,-25,70,2],[0,25,70,2],[-35,0,2,52],[35,0,2,52]])box(x,3,z,w,8,d,0x26374a);
for(const p of [[0,0,0,12,2,5],[-20,1,-7,8,2,7],[20,1,7,8,2,7],[0,2,15,7,2,5],[0,2,-15,7,2,5]])box(...p,0x31465d);

const keys={};let mouseDown=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(['Digit1','Digit2','Digit3'].includes(e.code))switchWeapon(+e.code.slice(-1))});
addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('mousedown',()=>{mouseDown=true;renderer.domElement.requestPointerLock?.()});
addEventListener('mouseup',()=>mouseDown=false);
addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){player.yaw-=e.movementX*.0025;player.pitch=THREE.MathUtils.clamp(player.pitch-e.movementY*.0025,-1.35,1.35)}});

const weapons={
 sword:{name:'KILIÇ',damage:24,range:3.2,arc:1.05,cool:.42,color:0xdfe8f2,kind:'sword',speed:1},
 axe:{name:'BALTA',damage:44,range:2.75,arc:.72,cool:.95,color:0xb8c1ca,kind:'axe',speed:.72},
 dagger:{name:'HANÇER',damage:14,range:2.35,arc:.5,cool:.18,color:0x9ee8ff,kind:'dagger',speed:1.35}
};
let currentWeapon='sword';

const player={pos:new THREE.Vector3(0,1.2,19),yaw:Math.PI,pitch:0,hp:100,attackCd:0,dashCd:0,dashes:2,score:0,attackAnim:0};
const enemy={pos:new THREE.Vector3(0,1.2,-18),yaw:0,pitch:0,hp:100,attackCd:0,hitCd:0,weapon:'sword',aiTimer:0,attackAnim:0};

function body(color){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(1.05,1.3,6,12),new THREE.MeshStandardMaterial({color,roughness:.42}));b.castShadow=true;g.add(b);const v=new THREE.Mesh(new THREE.BoxGeometry(.95,.35,.22),new THREE.MeshStandardMaterial({color:0x07101b,metalness:.7,roughness:.2}));v.position.set(0,.45,-.9);g.add(v);scene.add(g);return {group:g,body:b}}
const enemyView=body(0xff4d67);

const camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.08,120);scene.add(camera);
const hand=new THREE.Group();camera.add(hand);

function makeWeapon(data){const g=new THREE.Group();
 if(data.kind==='sword'){const blade=new THREE.Mesh(new THREE.BoxGeometry(.14,1.85,.09),new THREE.MeshStandardMaterial({color:data.color,metalness:.8,roughness:.18}));blade.position.y=.92;g.add(blade);const guard=new THREE.Mesh(new THREE.BoxGeometry(.75,.1,.14),new THREE.MeshStandardMaterial({color:0x8b6b35,metalness:.6}));guard.position.y=-.04;g.add(guard);const grip=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.62,10),new THREE.MeshStandardMaterial({color:0x4a2d20}));grip.position.y=-.39;g.add(grip)}
 else if(data.kind==='axe'){const h=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,1.9,10),new THREE.MeshStandardMaterial({color:0x633d25}));h.rotation.z=.12;h.position.y=.7;g.add(h);const head=new THREE.Mesh(new THREE.BoxGeometry(.9,.68,.16),new THREE.MeshStandardMaterial({color:data.color,metalness:.72,roughness:.2}));head.position.set(.25,1.45,0);head.rotation.z=-.28;g.add(head)}
 else{const blade=new THREE.Mesh(new THREE.ConeGeometry(.15,.9,4),new THREE.MeshStandardMaterial({color:data.color,metalness:.8,roughness:.15}));blade.rotation.z=-Math.PI/2;blade.position.x=.52;g.add(blade);const grip=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.52,10),new THREE.MeshStandardMaterial({color:0x3b251c}));grip.rotation.z=Math.PI/2;grip.position.x=-.1;g.add(grip)}
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g}
function switchWeapon(n){currentWeapon=n===1?'sword':n===2?'axe':'dagger';hand.clear();const w=makeWeapon(weapons[currentWeapon]);w.position.set(.7,-.62,-1.05);w.rotation.set(-.25,0,-.22);hand.add(w);player.attackAnim=0;updateHud()}
switchWeapon(1);

function forward(yaw){return new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw))}
function damagePlayer(n){if(player.hp<=0)return;player.hp=Math.max(0,player.hp-n);document.querySelector('#damageFlash').style.opacity=.7;setTimeout(()=>document.querySelector('#damageFlash').style.opacity=0,80);if(player.hp===0)end(false)}
function playerAttack(){const w=weapons[currentWeapon];if(player.attackCd>0||player.hp<=0)return;player.attackCd=w.cool;player.attackAnim=.22/w.speed;
 const to=new THREE.Vector3(enemy.pos.x-player.pos.x,0,enemy.pos.z-player.pos.z),dist=to.length();if(dist>w.range)return;to.normalize();const ang=Math.acos(THREE.MathUtils.clamp(forward(player.yaw).dot(to),-1,1));if(ang<=w.arc)enemy.hp=Math.max(0,enemy.hp-w.damage);if(enemy.hp===0)end(true)}
function enemyAttack(){const w=weapons[enemy.weapon];if(enemy.attackCd>0||enemy.hp<=0)return;enemy.attackCd=w.cool;enemy.attackAnim=.22/w.speed;const to=new THREE.Vector3(player.pos.x-enemy.pos.x,0,player.pos.z-enemy.pos.z),dist=to.length();if(dist<=w.range){to.normalize();const ang=Math.acos(THREE.MathUtils.clamp(forward(enemy.yaw).dot(to),-1,1));if(ang<=w.arc)damagePlayer(w.damage)}}

let running=true;
function end(win){running=false;document.querySelector('#message').style.display='block';document.querySelector('#message').innerHTML=(win?'🏆 RAKİP YENİLDİ!':'💀 YENİLDİN!')+'<br><button id="restart">YENİ RAUNT</button>';document.querySelector('#restart').onclick=reset}
function reset(){player.pos.set(0,1.2,19);player.hp=100;player.dashes=2;enemy.pos.set(0,1.2,-18);enemy.hp=100;enemy.attackCd=0;running=true;document.querySelector('#message').style.display='none'}
function dash(){if(player.dashes<=0||player.dashCd>0)return;player.dashes--;player.dashCd=.55;player.pos.addScaledVector(forward(player.yaw),5.5);player.pos.x=THREE.MathUtils.clamp(player.pos.x,-31,31);player.pos.z=THREE.MathUtils.clamp(player.pos.z,-21,21)}

function movePlayer(dt){let v=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(v.lengthSq()){v.normalize();const f=forward(player.yaw),r=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));v=f.multiplyScalar(v.z).add(r.multiplyScalar(v.x));player.pos.addScaledVector(v,(keys.ShiftLeft||keys.ShiftRight?16:10)*dt)}player.pos.x=THREE.MathUtils.clamp(player.pos.x,-31,31);player.pos.z=THREE.MathUtils.clamp(player.pos.z,-21,21);if(keys.Space&&!player.spaceHeld){dash();player.spaceHeld=true}if(!keys.Space)player.spaceHeld=false;if(mouseDown&&!player.mouseHeld){playerAttack();player.mouseHeld=true}if(!mouseDown)player.mouseHeld=false;player.attackCd=Math.max(0,player.attackCd-dt);player.dashCd=Math.max(0,player.dashCd-dt);if(player.dashes<2&&player.dashCd===0)player.dashes=2}
function moveEnemy(dt){const to=new THREE.Vector3(player.pos.x-enemy.pos.x,0,player.pos.z-enemy.pos.z);const dist=to.length();enemy.yaw=Math.atan2(to.x,to.z);if(dist>2.35)enemy.pos.addScaledVector(to.normalize(),(dist>8?5.5:3.2)*dt);else enemyAttack();enemy.pos.x=THREE.MathUtils.clamp(enemy.pos.x,-31,31);enemy.pos.z=THREE.MathUtils.clamp(enemy.pos.z,-21,21);enemy.attackCd=Math.max(0,enemy.attackCd-dt)}
function updateCamera(){camera.position.copy(player.pos);camera.position.y=player.pos.y+.65;const f=forward(player.yaw);f.y=Math.sin(player.pitch);camera.lookAt(camera.position.clone().add(f.multiplyScalar(10)))}
function updateEnemyView(){enemyView.group.position.copy(enemy.pos);enemyView.group.rotation.y=enemy.yaw}
function updateWeaponAnim(dt){const w=hand.children[0];if(player.attackAnim>0){player.attackAnim-=dt;const t=Math.max(0,player.attackAnim/(.22/weapons[currentWeapon].speed));w.rotation.z=-.22-1.15*(1-t);w.rotation.x=-.25+.8*(1-t)}else{w.rotation.z=THREE.MathUtils.lerp(w.rotation.z,-.22,.22);w.rotation.x=THREE.MathUtils.lerp(w.rotation.x,-.25,.22)}}
function updateHud(){const w=weapons[currentWeapon];document.querySelector('#hp').style.width=player.hp+'%';document.querySelector('#info').innerHTML='<b>'+w.name+'</b> · Hasar '+w.damage+' · Menzil '+w.range+'<br>Atılma: '+player.dashes+'/2';document.querySelector('#weapon').textContent='⚔️ '+w.name;document.querySelector('#score').textContent='RAKİP CANI: '+enemy.hp}
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.033);last=now;if(running){movePlayer(dt);moveEnemy(dt);updateCamera();updateEnemyView();updateWeaponAnim(dt);updateHud()}renderer.render(scene,camera)}animate(performance.now());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
