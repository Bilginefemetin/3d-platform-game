<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Menu</title>
  <link rel="stylesheet" href="menu.css?v=4" />
</head>
<body>
  <main class="menu-shell">
    <header class="topbar">
      <div class="currency"><span class="coin"></span><strong id="coin-count">0</strong></div>
      <div class="player-label">OYUNCU</div>
    </header>

    <section class="character-stage" aria-label="Karakter">
      <div class="character-shadow"></div>
      <div class="character" id="character"></div>
      <div class="character-name-wrap">
        <input id="character-name" maxlength="16" value="İsimsiz Karakter" aria-label="Karakter adı" />
        <small>Karakterinin adını sen belirle</small>
      </div>
    </section>

    <nav class="menu-tabs" aria-label="Ana menü">
      <a class="play-button" href="../">OYNA</a>
      <button data-section="market">MARKET</button>
      <button data-section="inventory">ENVANTER</button>
      <button data-section="ranking">SIRALAMA</button>
      <button data-section="settings">AYARLAR</button>
    </nav>

    <section id="menu-panel" class="menu-panel" aria-live="polite">
      <h1 id="panel-title">MARKET</h1>
      <div id="panel-content"></div>
    </section>
  </main>
  <script src="menu.js?v=4"></script>
</body>
</html>
